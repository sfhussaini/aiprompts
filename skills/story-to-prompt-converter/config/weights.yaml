# =============================================================================
# SCORING WEIGHTS CONFIGURATION
# =============================================================================
# This file allows dynamic adjustment of scoring weights without modifying code.
# Use different presets for different use cases: cinematic, intimate, action.

scoring_weights:
  # Core quality dimensions (must sum to 1.0)
  action_completeness: 0.30    # 30% - How well the frame completes its intended action/beat
  visual_interest: 0.25         # 25% - Visual appeal and composition interest
  lighting_quality: 0.15        # 15% - Lighting aesthetics and mood appropriateness
  composition: 0.15             # 15% - Framing, rule of thirds, visual balance
  narrative_significance: 0.15  # 15% - How well it advances the story/narrative arc

# =============================================================================
# VALIDATION THRESHOLDS
# =============================================================================
validation:
  min_score_threshold: 85.0     # Minimum score for production-ready frames (0-100)
  max_score_threshold: 100.0    # Maximum possible score
  
# =============================================================================
# SCORE CATEGORIES & RANGES
# =============================================================================
score_categories:
  peak: [95, 100]               # Peak quality - must-include frames
  high: [85, 94]                # High quality - strong candidates
  medium: [70, 84]              # Medium quality - consider based on context
  low: [50, 69]                 # Low quality - review for edge cases
  fail: [0, 49]                 # Fail threshold - typically filtered out

# =============================================================================
# USE CASE PRESETS (Optional)
# =============================================================================
presets:
  cinematic:
    action_completeness: 0.35
    visual_interest: 0.25
    lighting_quality: 0.15
    composition: 0.15
    narrative_significance: 0.10
    
  intimate:
    action_completeness: 0.25
    visual_interest: 0.30
    lighting_quality: 0.20
    composition: 0.15
    narrative_significance: 0.10
    
  action:
    action_completeness: 0.40
    visual_interest: 0.20
    lighting_quality: 0.10
    composition: 0.15
    narrative_significance: 0.15

# =============================================================================
# DEFAULT CONFIGURATION (Used if no preset specified)
# =============================================================================
default_preset: cinematic
