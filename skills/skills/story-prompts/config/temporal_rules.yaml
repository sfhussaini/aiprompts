# =============================================================================
# TEMPORAL DISTRIBUTION RULES
# =============================================================================
# These rules control how frames are selected based on time gaps and scene transitions.

temporal_distribution:
  # Minimum gap between consecutive frames (in seconds)
  min_gap_seconds: 0.5
  
  # Maximum number of frames to select from a single continuous shot
  max_frames_per_shot: 3
  
  # Require at least one frame from each major time segment
  require_temporal_diversity: true
  time_segments:
    - name: "early"
      timestamp_range: [0, 1.5]
      min_frames: 1
    - name: "middle"
      timestamp_range: [1.5, 3.0]
      min_frames: 1
    - name: "late"
      timestamp_range: [3.0, 4.5]
      min_frames: 1

# =============================================================================
# ACTION PEAK DETECTION RULES
# =============================================================================
action_peak_detection:
  # Minimum score threshold for peak frames
  min_score_threshold: 95
  
  # Maximum number of peak frames to select
  max_peak_frames: 2
  
  # Consider frames with significant time gaps as potential peaks
  significant_gap_threshold: 1.0
  
  # Boost scores for frames near action climax points (if metadata available)
  action_climax_boost: true
  action_climax_score_range: [90, 100]

# =============================================================================
# SCENE TRANSITION RULES
# =============================================================================
scene_transitions:
  # Minimum gap to consider a scene transition
  min_transition_gap: 2.0
  
  # Require at least one frame from each detected scene
  require_scene_coverage: true
  
  # Boost frames that mark scene boundaries
  boundary_frame_boost: 5.0

# =============================================================================
# NARRATIVE FLOW RULES
# =============================================================================
narrative_flow:
  # Prefer frames with good temporal spacing for smooth transitions
  prefer_temporal_spacing: true
  ideal_frame_spacing: 1.0
  
  # Consider action progression (if metadata available)
  consider_action_progression: true
